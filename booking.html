    <section class="booking-section" id="booking">
        <div class="booking-container">
            <div class="booking-header">
                <h2>احجز جلستك الآن</h2>
                <p>املأ النموذج التالي وسنتصل بك لتأكيد الحجز خلال 24 ساعة</p>
            </div>

            <div class="booking-card">
                <div class="booking-steps">
                    <div class="booking-step active">معلومات الشخصية</div>
                    <div class="booking-step">تفاصيل الجلسة</div>
                    <div class="booking-step">تأكيد الحجز</div>
                </div>

                <div class="booking-form-container">
                    <form id="bookingForm" onsubmit="event.preventDefault(); submitBookingForm();">
                        <div class="form-grid">

                            <div class="form-group">
                                <label for="birthDate" class="form-label">تاريخ الميلاد</label>
                                <input type="date" id="birthDate" class="form-control" required>
                            </div>

                            <div class="form-group">
                                <label for="gender" class="form-label">الجنس</label>
                                <div class="select-wrapper">
                                    <select id="gender" class="form-control form-select" required>
                                        <option value="">اختر الجنس</option>
                                        <option value="male">ذكر</option>
                                        <option value="female">أنثى</option>
                                    </select>
                                </div>
                            </div>

                            <div class="form-group full-width">
                                <label for="address" class="form-label">العنوان (اختياري)</label>
                                <input type="text" id="address" class="form-control">
                            </div>
                        </div>

                        <div class="form-group full-width">
                            <label class="form-label">نوع الجلسة المطلوبة</label>
                            <div class="session-types">
                                <div class="form-check">
                                    <input type="radio" id="individual" name="sessionType" value="individual" checked
                                        class="form-check-input">
                                    <label for="individual" class="form-check-label">جلسة فردية</label>
                                </div>
                                <div class="form-check">
                                    <input type="radio" id="group" name="sessionType" value="group"
                                        class="form-check-input">
                                    <label for="group" class="form-check-label">جلسة جماعية</label>
                                </div>
                                <div class="form-check">
                                    <input type="radio" id="child" name="sessionType" value="child"
                                        class="form-check-input">
                                    <label for="child" class="form-check-label">جلسة للأطفال</label>
                                </div>
                            </div>
                        </div>

                        <div class="form-group full-width">
                            <label for="notes" class="form-label">ملاحظات إضافية (اختياري)</label>
                            <textarea id="notes" class="form-control" rows="4"></textarea>
                        </div>

                        <div class="booking-actions">
                            <button type="button" class="btn btn-secondary">رجوع</button>
                            <button type="submit" class="btn btn-primary">تأكيد الحجز</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </section>
